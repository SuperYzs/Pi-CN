name: Bug report / 问题反馈
description: Report a reproducible localization, recovery, or uninstall problem.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "English and 简体中文 are welcome. Do not include API keys, tokens, private sessions, or backup contents."
  - type: input
    id: versions
    attributes:
      label: Pi and Pi-CN versions / 版本
      placeholder: "Pi 1.1.0, Pi-CN 0.7.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Node.js / 系统与 Node.js
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Installation source / 安装来源
      options:
        - Git
        - Local directory / 本地目录
        - npm
        - Extension file / 扩展文件
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      description: Include the command or setting involved and the expected result.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Actual result and relevant error / 实际结果与错误
      description: Redact credentials and private information before submitting.
    validations:
      required: true
